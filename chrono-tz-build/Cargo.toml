[package]
name = "sad-chrono-tz-build"
version = "0.5.1"
edition = "2021"
rust-version = "1.66.0"
authors = ["Sadco Security Team", "The chrono-tz contributors"]
description = "Internal build script for sad-chrono-tz"
homepage = "https://github.com/sadco-io/sad-chrono-tz"
repository = "https://github.com/sadco-io/sad-chrono-tz"
documentation = "https://docs.rs/sad-chrono-tz-build/"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["script", "chrono-tz", "timezone", "iana"]
categories = ["development-tools::build-utils"]
include = [
  "src/*.rs",
  "LICENSE-MIT",
  "LICENSE-APACHE",
  "NOTICE",
  "SECURITY.md",
  "README.md",
]

[features]
filter-by-regex = ["regex"]
case-insensitive = ["uncased", "phf_shared/uncased"]
regex = ["dep:regex"]

[dependencies]
parse-zoneinfo = { package = "sad-parse-zoneinfo", path = "../parse-zoneinfo", version = "0.5.1" }
regex = { default-features = false, version = "1", optional = true }
phf_codegen = { version = "0.13", default-features = false }
uncased = { version = "0.9", optional = true, default-features = false }

# needed only to forward feature for uncased
phf_shared = { version = "0.13", default-features = false, optional = true }
