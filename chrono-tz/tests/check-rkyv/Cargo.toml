[package]
name = "check-rkyv"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["w32", "alloc"]
alloc = ["rkyv/alloc", "sad-chrono/rkyv-validation"]
w16 = ["rkyv/pointer_width_16", "sad-chrono/rkyv-16"]
w32 = ["rkyv/pointer_width_32", "sad-chrono/rkyv-32"]
w64 = ["rkyv/pointer_width_64", "sad-chrono/rkyv-64"]

[dev-dependencies]
rkyv = { version = "0.8.18", default-features = false, features = ["bytecheck"] }
sad-chrono = { version = "0.5.1", default-features = false }
sad-chrono-tz = { path = "../..", features = ["rkyv"] }

[workspace]
