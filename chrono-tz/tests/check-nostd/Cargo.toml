[package]
authors = ["Brandon W Maister <quodlibetor@gmail.com>"]
edition = "2018"
readme = "README.md"
name = "check-nostd"
version = "0.1.0"
resolver = "2"

[dependencies]
cortex-m-rt = "0.7.0"
sad-chrono-tz = { path = "../../", default-features = false }

[features]
serde1 = ["sad-chrono-tz/serde"]
case-insensitive = ["sad-chrono-tz/case-insensitive"]
defmt = ["sad-chrono-tz/defmt"]
rkyv = ["sad-chrono-tz/rkyv"]

[workspace]
